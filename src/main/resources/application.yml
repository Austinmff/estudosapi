spring:
  application:
    name: estudosapi

  datasource:
    url: jdbc:postgresql://localhost:5432/estudosapi
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
